analyzer:
  exclude:
    - build/**
    - android/**
    # Templates copied into lib/ai by optional_ai/enable_ai.sh, not active source.
    - optional_ai/**
    - web/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
